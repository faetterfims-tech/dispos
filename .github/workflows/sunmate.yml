# Henter dagens tidslinje fra SunMate og gemmer den som timer i dispos.
# SunMates API har ingen historik, så den skal samles løbende.
name: SunMate-indsamling

# Tidsplanen er slået fra: SunMates Cloudflare blokerer kald fra servere.
# Indsamlingen kører i stedet fra Home Assistant (docs/home-assistant.md).
# Kan stadig startes manuelt, og tidsplanen kan slås til igen, hvis SunMate
# undtager API'et fra bot-tjekket.
on:
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hent og gem SunMate-data
        env:
          DISPOS_PASSWORD: ${{ secrets.DISPOS_PASSWORD }}
        run: |
          if [ -z "$DISPOS_PASSWORD" ]; then
            echo "::error::Secret DISPOS_PASSWORD mangler (GitHub → Settings → Secrets and variables → Actions)."
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            --user "github:${DISPOS_PASSWORD}" \
            https://dispos.dk/api/sunmate/collect
